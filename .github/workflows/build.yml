name: Build AyuGram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "android.debug.keystore=debug.keystore" >> local.properties
          echo "android.debug.keystore.password=android" >> local.properties
          echo "android.debug.key.alias=androiddebugkey" >> local.properties
          echo "android.debug.key.password=android" >> local.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-apk
          path: app/build/outputs/apk/release/*.apk
